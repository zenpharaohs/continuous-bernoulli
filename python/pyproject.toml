[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cb-sampler"
version = "0.1.0a1"
description = "Continuous-binomial posterior sampler backed by the validated C implementation"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Andrew Mullhaupt" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: C",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.23"
]

[project.urls]
Repository = "https://github.com/zenpharaohs/continuous-bernoulli"
Issues = "https://github.com/zenpharaohs/continuous-bernoulli/issues"

[project.scripts]
cb-validate = "cb_sampler.validation:main"
cb-example = "cb_sampler.examples:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-win32 *-manylinux_i686 *-musllinux_*"
test-command = "pytest --rootdir=. --override-ini=pythonpath= --import-mode=importlib {project}/python/tests -q"
test-requires = [
  "pytest",
]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.cibuildwheel.macos]
archs = ["auto"]
