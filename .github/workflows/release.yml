name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Match release tag to package version
        working-directory: python
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"release tag {tag!r} does not match v{version}")
          PY

  build-sdist:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build --sdist --outdir dist python
      - uses: actions/upload-artifact@v7
        with:
          name: distribution-sdist
          path: dist/*

  build-wheels:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: python
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: distribution-wheel-${{ matrix.os }}
          path: wheelhouse/*

  collect:
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: distribution-*
          path: dist
          merge-multiple: true
      - uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/*

  publish-testpypi:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/cb-sampler
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install from TestPyPI
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in {1..12}; do
            if python -m pip install --no-cache-dir \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "cb-sampler==${version}"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then exit 1; fi
            sleep 10
          done
          python -c "import cb_sampler; assert cb_sampler.__version__ == '${version}'; print(cb_sampler.sample(2, 5, seed=1))"

  publish-pypi:
    needs: verify-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cb-sampler
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  upload-release-assets:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist
      - name: Attach distributions to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
