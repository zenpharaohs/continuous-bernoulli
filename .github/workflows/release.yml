name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Match release tag to package version
        working-directory: python
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"release tag {tag!r} does not match v{version}")
          PY

  build-sdist:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build --sdist --outdir dist python
      - uses: actions/upload-artifact@v7
        with:
          name: distribution-sdist
          path: dist/*

  build-wheels:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: python
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: distribution-wheel-${{ matrix.os }}
          path: wheelhouse/*

  collect:
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: distribution-*
          path: dist
          merge-multiple: true
      - uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/*

  publish-pypi:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cb-sampler
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  upload-release-assets:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist
      - name: Attach distributions to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
